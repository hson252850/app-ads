name: Deploy tới GitHub Pages

# Pages của repo app-ads: Source = "GitHub Actions".
# Workflow build Next.js ra tĩnh (./out) rồi deploy qua actions/deploy-pages.
# CNAME + app-ads.txt được copy vào bản build để giữ custom domain + quảng cáo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Chỉ chạy ở repo deploy, bỏ qua ở repo nguồn.
    if: github.repository == 'hson252850/app-ads'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Cài dependencies
        run: npm ci

      - name: Build (xuất tĩnh vào ./out)
        run: npm run build

      - name: Giữ file cấu hình ads + tắt Jekyll
        run: |
          cp CNAME out/CNAME
          cp app-ads.txt out/app-ads.txt
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
