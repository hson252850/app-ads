name: Build & publish static site

# GitHub Pages của repo này đang ở chế độ "Deploy from a branch" (main / root).
# Workflow build Next.js ra tĩnh rồi commit file build vào gốc nhánh main để
# Pages phục vụ. Giữ nguyên source, CNAME, app-ads.txt.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "public/**"
      - "types/**"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    # Chỉ chạy ở repo deploy (có Pages + CNAME), bỏ qua ở repo nguồn.
    if: github.repository == 'hson252850/app-ads'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài dependencies
        run: npm ci

      - name: Build (xuất tĩnh vào ./out)
        run: npm run build

      - name: Đưa bản build ra gốc repo
        run: |
          cp CNAME out/CNAME
          cp app-ads.txt out/app-ads.txt
          touch out/.nojekyll
          # Xoá bản publish cũ ở gốc, thay bằng bản mới (source vẫn giữ nguyên)
          rm -rf _next 404 404.html index.html index.txt .nojekyll \
                 assets gallery favicon.ico icon.png apple-icon.png
          cp -R out/. .
          rm -rf out

      - name: Commit bản build
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi ở bản build."
          else
            git commit -m "chore: rebuild static site [skip ci]"
            git push
          fi
